name: Build Blaster

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Arrange source into subfolders
        shell: cmd
        run: |
          md audio
          md convolution
          md equalizer
          md isolation
          md license
          md mixing
          md playback
          md presets
          md reverb
          md ui
          md voice
          copy biquad.hpp audio\
          copy clip_util.hpp audio\
          copy delay_bank.hpp audio\
          copy fixed_ring.hpp audio\
          copy render_feed.hpp audio\
          copy convolution_reverb.hpp convolution\
          copy fft.hpp convolution\
          copy partition.hpp convolution\
          copy bass_boost.hpp equalizer\
          copy eq_config.hpp equalizer\
          copy eq_presets.hpp equalizer\
          copy filter_design.hpp equalizer\
          copy graphic_equalizer.hpp equalizer\
          copy expander_gate.hpp isolation\
          copy voice_isolator.hpp isolation\
          copy license_codec.hpp license\
          copy license_core.hpp license\
          copy license_pubkey.inc license\
          copy license_ui.hpp license\
          copy amount_law.hpp mixing\
          copy echo_tap.hpp mixing\
          copy fx_parts.hpp mixing\
          copy mic_drive.hpp mixing\
          copy mic_tone.hpp mixing\
          copy out_chain.hpp mixing\
          copy send_level.hpp mixing\
          copy soft_clip.hpp mixing\
          copy step_back.hpp mixing\
          copy subsonic.hpp mixing\
          copy wet_peak.hpp mixing\
          copy hear_tap.hpp playback\
          copy player.hpp playback\
          copy program_tap.hpp playback\
          copy recorder.hpp playback\
          copy sound_board.hpp playback\
          copy sound_convert.hpp playback\
          copy sound_edit.hpp playback\
          copy sound_save.hpp playback\
          copy card_presets.hpp presets\
          copy card_core.hpp reverb\
          copy reverb_engine.hpp reverb\
          copy reverb_params.hpp reverb\
          copy font_file.hpp ui\
          copy cmss3d.hpp voice\
          copy glitch_pad.hpp voice\
          copy glitcher.hpp voice\
          copy pitch_tracker.hpp voice\
          copy song_changer.hpp voice\
          copy song_shifter.hpp voice\
          copy tempo.hpp voice\
          copy timbre.hpp voice\
          copy vocoder.hpp voice\
          copy voice_fx.hpp voice\
          copy voice_masks.hpp voice\
          copy voice_shaper.hpp voice\
          copy voice_tone.hpp voice\

      - name: Build Blaster
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild Blaster.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download yt-dlp
        shell: pwsh
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest").tag_name
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile SHA2-256SUMS

      - name: Download VB-Cable
        shell: pwsh
        run: |
          try {
            $page = Invoke-WebRequest "https://vb-audio.com/Cable/" -UseBasicParsing
            $href = ($page.Links | Where-Object { $_.href -match '(?i)VBCABLE_Driver.*\.zip' } | Select-Object -First 1).href
          } catch { $href = $null }
          if (-not $href) { $href = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" }
          if ($href -notmatch '^https?://') { $href = "https://vb-audio.com$href" }
          Invoke-WebRequest $href -OutFile VBCABLE_Driver.zip

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Blaster\Blaster.exe release\
          Copy-Item yt-dlp.exe release\
          Copy-Item SHA2-256SUMS release\
          Copy-Item VBCABLE_Driver.zip release\

      - uses: actions/upload-artifact@v4
        with:
          name: Blaster-x64
          path: release\
          if-no-files-found: error
