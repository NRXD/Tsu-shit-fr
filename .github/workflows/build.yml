name: Build Blaster

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Arrange source into subfolders
        shell: pwsh
        run: |
          $root = $PWD.Path

          # A file named LICENSE collides with the "license" folder on Windows (case-insensitive)
          $lic = Join-Path $root "license"
          if (Test-Path -LiteralPath $lic -PathType Leaf) {
            Move-Item -LiteralPath $lic -Destination (Join-Path $root "LICENSE.txt") -Force
            Write-Host "renamed LICENSE -> LICENSE.txt"
          }

          $folders = @("audio","convolution","equalizer","isolation","license","mixing","playback","presets","reverb","ui","voice")
          foreach ($f in $folders) {
            [System.IO.Directory]::CreateDirectory((Join-Path $root $f)) | Out-Null
          }

          # source file in root, destination folder, destination file name
          $map = @(
            @("fixed_ring.hpp","audio","fixed_ring.hpp"),
            @("render_feed.hpp","audio","render_feed.hpp"),

            @("convolution_reverb.hpp","convolution","convolution_reverb.hpp"),
            @("fft.hpp","convolution","fft.hpp"),
            @("partition.hpp","convolution","partition.hpp"),

            @("biquad.hpp","equalizer","biquad.hpp"),
            @("bass_boost.hpp","equalizer","bass_boost.hpp"),
            @("eq_config.hpp","equalizer","eq_config.hpp"),
            @("eq_presets.hpp","equalizer","eq_presets.hpp"),
            @("filter_design.hpp","equalizer","filter_design.hpp"),
            @("graphic_equalizer.hpp","equalizer","graphic_equalizer.hpp"),

            @("expander_gate.hpp","isolation","expander_gate.hpp"),
            @("voice_isolator.hpp","isolation","voice_isolator.hpp"),

            @("license_codec.hpp","license","license_codec.hpp"),
            @("license_core.hpp","license","license_core.hpp"),
            @("license_pubkey.inc","license","license_pubkey.inc"),
            @("license_ui.hpp","license","license_ui.hpp"),

            @("amount_law.hpp","mixing","amount_law.hpp"),
            @("cmss3d.hpp","mixing","cmss3d.hpp"),
            @("echo_tap.hpp","mixing","echo_tap.hpp"),
            @("mic_drive.hpp","mixing","mic_drive.hpp"),
            @("mic_tone.hpp","mixing","mic_tone.hpp"),
            @("out_chain.hpp","mixing","out_chain.hpp"),
            @("send_level.hpp","mixing","send_level.hpp"),
            @("soft_clip.hpp","mixing","soft_clip.hpp"),
            @("step_back.hpp","mixing","step_back.hpp"),
            @("subsonic.hpp","mixing","subsonic.hpp"),
            @("wet_peak.hpp","mixing","wet_peak.hpp"),

            @("clip_util.hpp","playback","clip_util.hpp"),
            @("hear_tap.hpp","playback","hear_tap.hpp"),
            @("player.hpp","playback","player.hpp"),
            @("program_tap.hpp","playback","program_tap.hpp"),
            @("recorder.hpp","playback","recorder.hpp"),
            @("sound_board.hpp","playback","sound_board.hpp"),
            @("sound_convert.hpp","playback","sound_convert.hpp"),
            @("sound_edit.hpp","playback","sound_edit.hpp"),
            @("sound_save.hpp","playback","sound_save.hpp"),

            @("card_presets.hpp","presets","card_presets.hpp"),

            # the reverb folder needs the OTHER biquad (namespace eax), uploaded as "biquad (1).hpp"
            @("biquad (1).hpp","reverb","biquad.hpp"),
            @("card_core.hpp","reverb","card_core.hpp"),
            @("delay_bank.hpp","reverb","delay_bank.hpp"),
            @("reverb_engine.hpp","reverb","reverb_engine.hpp"),
            @("reverb_params.hpp","reverb","reverb_params.hpp"),

            @("font_file.hpp","ui","font_file.hpp"),

            @("fx_parts.hpp","voice","fx_parts.hpp"),
            @("glitch_pad.hpp","voice","glitch_pad.hpp"),
            @("glitcher.hpp","voice","glitcher.hpp"),
            @("pitch_tracker.hpp","voice","pitch_tracker.hpp"),
            @("song_changer.hpp","voice","song_changer.hpp"),
            @("song_shifter.hpp","voice","song_shifter.hpp"),
            @("tempo.hpp","voice","tempo.hpp"),
            @("timbre.hpp","voice","timbre.hpp"),
            @("vocoder.hpp","voice","vocoder.hpp"),
            @("voice_fx.hpp","voice","voice_fx.hpp"),
            @("voice_masks.hpp","voice","voice_masks.hpp"),
            @("voice_shaper.hpp","voice","voice_shaper.hpp"),
            @("voice_tone.hpp","voice","voice_tone.hpp")
          )

          $missing = 0
          foreach ($e in $map) {
            $src = Join-Path $root $e[0]
            $dst = Join-Path (Join-Path $root $e[1]) $e[2]
            if (-not [System.IO.File]::Exists($src)) { Write-Host "MISSING $($e[0])"; $missing++; continue }
            [System.IO.File]::Copy($src, $dst, $true)
            Write-Host "copied $($e[0]) -> $($e[1])\$($e[2])"
          }
          if ($missing -gt 0) { Write-Host "$missing source file(s) missing"; exit 1 }

      - name: Build Blaster
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild Blaster.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download yt-dlp
        shell: pwsh
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest").tag_name
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile SHA2-256SUMS

      - name: Download VB-Cable
        shell: pwsh
        run: |
          try {
            $page = Invoke-WebRequest "https://vb-audio.com/Cable/" -UseBasicParsing
            $href = ($page.Links | Where-Object { $_.href -match '(?i)VBCABLE_Driver.*\.zip' } | Select-Object -First 1).href
          } catch { $href = $null }
          if (-not $href) { $href = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" }
          if ($href -notmatch '^https?://') { $href = "https://vb-audio.com$href" }
          Invoke-WebRequest $href -OutFile VBCABLE_Driver.zip

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Blaster\Blaster.exe release\
          Copy-Item yt-dlp.exe release\
          Copy-Item SHA2-256SUMS release\
          Copy-Item VBCABLE_Driver.zip release\

      - uses: actions/upload-artifact@v4
        with:
          name: Blaster-x64
          path: release\
          if-no-files-found: error
