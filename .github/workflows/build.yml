name: Build Blaster

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Arrange source into subfolders
        shell: pwsh
        run: |
          $root = $PWD.Path
          $map = @{
            "audio"       = @("biquad.hpp","clip_util.hpp","delay_bank.hpp","fixed_ring.hpp","render_feed.hpp")
            "convolution" = @("convolution_reverb.hpp","fft.hpp","partition.hpp")
            "equalizer"   = @("bass_boost.hpp","eq_config.hpp","eq_presets.hpp","filter_design.hpp","graphic_equalizer.hpp")
            "isolation"   = @("expander_gate.hpp","voice_isolator.hpp")
            "license"     = @("license_codec.hpp","license_core.hpp","license_pubkey.inc","license_ui.hpp")
            "mixing"      = @("amount_law.hpp","echo_tap.hpp","fx_parts.hpp","mic_drive.hpp","mic_tone.hpp","out_chain.hpp","send_level.hpp","soft_clip.hpp","step_back.hpp","subsonic.hpp","wet_peak.hpp")
            "playback"    = @("hear_tap.hpp","player.hpp","program_tap.hpp","recorder.hpp","sound_board.hpp","sound_convert.hpp","sound_edit.hpp","sound_save.hpp")
            "presets"     = @("card_presets.hpp")
            "reverb"      = @("card_core.hpp","reverb_engine.hpp","reverb_params.hpp")
            "ui"          = @("font_file.hpp")
            "voice"       = @("cmss3d.hpp","glitch_pad.hpp","glitcher.hpp","pitch_tracker.hpp","song_changer.hpp","song_shifter.hpp","tempo.hpp","timbre.hpp","vocoder.hpp","voice_fx.hpp","voice_masks.hpp","voice_shaper.hpp","voice_tone.hpp")
          }
          foreach ($folder in $map.Keys) {
            $dest = Join-Path $root $folder
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            foreach ($file in $map[$folder]) {
              $src = Join-Path $root $file
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination (Join-Path $dest $file) -Force
              }
            }
          }

      - name: Build Blaster
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild Blaster.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download yt-dlp
        shell: pwsh
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest").tag_name
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile SHA2-256SUMS

      - name: Download VB-Cable
        shell: pwsh
        run: |
          try {
            $page = Invoke-WebRequest "https://vb-audio.com/Cable/" -UseBasicParsing
            $href = ($page.Links | Where-Object { $_.href -match '(?i)VBCABLE_Driver.*\.zip' } | Select-Object -First 1).href
          } catch { $href = $null }
          if (-not $href) { $href = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" }
          if ($href -notmatch '^https?://') { $href = "https://vb-audio.com$href" }
          Invoke-WebRequest $href -OutFile VBCABLE_Driver.zip

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Blaster\Blaster.exe release\
          Copy-Item yt-dlp.exe release\
          Copy-Item SHA2-256SUMS release\
          Copy-Item VBCABLE_Driver.zip release\

      - uses: actions/upload-artifact@v4
        with:
          name: Blaster-x64
          path: release\
          if-no-files-found: error
