name: Build Blaster

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Arrange source into subfolders
        shell: pwsh
        run: |
          $root = $PWD.Path
          $folders = @("audio","convolution","equalizer","isolation","license","mixing","playback","presets","reverb","ui","voice")
          foreach ($f in $folders) {
            $p = "$root\$f"
            [System.IO.Directory]::CreateDirectory($p) | Out-Null
            Write-Host "created $p exists=$([System.IO.Directory]::Exists($p))"
          }
          $map = @(
            @("biquad.hpp","audio"), @("clip_util.hpp","audio"), @("delay_bank.hpp","audio"),
            @("fixed_ring.hpp","audio"), @("render_feed.hpp","audio"),
            @("convolution_reverb.hpp","convolution"), @("fft.hpp","convolution"), @("partition.hpp","convolution"),
            @("bass_boost.hpp","equalizer"), @("eq_config.hpp","equalizer"), @("eq_presets.hpp","equalizer"),
            @("filter_design.hpp","equalizer"), @("graphic_equalizer.hpp","equalizer"),
            @("expander_gate.hpp","isolation"), @("voice_isolator.hpp","isolation"),
            @("license_codec.hpp","license"), @("license_core.hpp","license"),
            @("license_pubkey.inc","license"), @("license_ui.hpp","license"),
            @("amount_law.hpp","mixing"), @("echo_tap.hpp","mixing"), @("fx_parts.hpp","mixing"),
            @("mic_drive.hpp","mixing"), @("mic_tone.hpp","mixing"), @("out_chain.hpp","mixing"),
            @("send_level.hpp","mixing"), @("soft_clip.hpp","mixing"), @("step_back.hpp","mixing"),
            @("subsonic.hpp","mixing"), @("wet_peak.hpp","mixing"),
            @("hear_tap.hpp","playback"), @("player.hpp","playback"), @("program_tap.hpp","playback"),
            @("recorder.hpp","playback"), @("sound_board.hpp","playback"), @("sound_convert.hpp","playback"),
            @("sound_edit.hpp","playback"), @("sound_save.hpp","playback"),
            @("card_presets.hpp","presets"),
            @("card_core.hpp","reverb"), @("reverb_engine.hpp","reverb"), @("reverb_params.hpp","reverb"),
            @("font_file.hpp","ui"),
            @("cmss3d.hpp","voice"), @("glitch_pad.hpp","voice"), @("glitcher.hpp","voice"),
            @("pitch_tracker.hpp","voice"), @("song_changer.hpp","voice"), @("song_shifter.hpp","voice"),
            @("tempo.hpp","voice"), @("timbre.hpp","voice"), @("vocoder.hpp","voice"),
            @("voice_fx.hpp","voice"), @("voice_masks.hpp","voice"), @("voice_shaper.hpp","voice"),
            @("voice_tone.hpp","voice")
          )
          foreach ($entry in $map) {
            $src = "$root\$($entry[0])"
            $dst = "$root\$($entry[1])\$($entry[0])"
            if ([System.IO.File]::Exists($src)) {
              [System.IO.File]::Copy($src, $dst, $true)
              Write-Host "copied $($entry[0]) -> $($entry[1])"
            } else {
              Write-Host "MISSING $src"
            }
          }

      - name: Build Blaster
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild Blaster.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download yt-dlp
        shell: pwsh
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest").tag_name
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$tag"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile SHA2-256SUMS

      - name: Download VB-Cable
        shell: pwsh
        run: |
          try {
            $page = Invoke-WebRequest "https://vb-audio.com/Cable/" -UseBasicParsing
            $href = ($page.Links | Where-Object { $_.href -match '(?i)VBCABLE_Driver.*\.zip' } | Select-Object -First 1).href
          } catch { $href = $null }
          if (-not $href) { $href = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" }
          if ($href -notmatch '^https?://') { $href = "https://vb-audio.com$href" }
          Invoke-WebRequest $href -OutFile VBCABLE_Driver.zip

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Blaster\Blaster.exe release\
          Copy-Item yt-dlp.exe release\
          Copy-Item SHA2-256SUMS release\
          Copy-Item VBCABLE_Driver.zip release\

      - uses: actions/upload-artifact@v4
        with:
          name: Blaster-x64
          path: release\
          if-no-files-found: error
